<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasim Akram Shaik | Data Scientist & ML Engineer</title>
    <meta name="description" content="Interactive cyberpunk portfolio — walk around and explore!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- Loading screen -->
        <div id="loading-screen">
            <div class="load-char"></div>
            <div class="load-bar-wrap">
                <div class="load-bar" id="loadBar"></div>
            </div>
            <div class="load-pct" id="loadPct">0%</div>
            <p class="load-tip">Initializing cyberpunk city...</p>
        </div>

        <!-- Game canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD overlay -->
        <div id="hud" class="hidden">
            <div class="hud-name">WASIM<span class="pink">.</span>EXE</div>
            <div class="hud-hint" id="hudHint"></div>
            <div class="hud-controls">
                <span>← → MOVE</span>
                <span>↑ ENTER BUILDING</span>
            </div>
        </div>

        <!-- Modal for content -->
        <div id="modal" class="modal hidden">
            <div class="modal-inner">
                <button class="modal-close" id="modalClose">✕</button>
                <div class="modal-header">
                    <span class="modal-tag" id="modalTag"></span>
                    <h2 id="modalTitle"></h2>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <!-- Intro overlay -->
        <div id="intro" class="intro">
            <div class="intro-box">
                <h1>WASIM AKRAM SHAIK</h1>
                <p class="intro-sub">[ Data Scientist & ML Engineer ]</p>
                <p class="intro-desc">Walk around my cyberpunk city to explore my portfolio.<br>Use <strong>← →</strong> arrow keys to move, <strong>↑</strong> or <strong>Enter</strong> near a building to interact.</p>
                <button id="startBtn" class="cyber-btn">START_EXPLORING</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
